<!DOCTYPE html><html><head>
  <base href="/MedicalApp-Clean/">
  
  <meta charset="UTF-8">
  <title>MediRecords Pro</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCrJBZBBvH_C6zVQxQ7WZl7NhooYgb0870",
      authDomain: "medirecords-pro.firebaseapp.com",
      projectId: "medirecords-pro",
      storageBucket: "medirecords-pro.firebasestorage.app",
      messagingSenderId: "379331373787",
      appId: "1:379331373787:web:33555fcacc7fa3a92a7afe"
    };

    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();

    // 🚀 NEW BLOCK: Handles notifications while the app is OPEN and FOCUSED
    messaging.onMessage((payload) => {
      console.log('Foreground message received:', payload);
      
      // Manually trigger a notification popup
      new Notification(payload.notification.title, {
        body: payload.notification.body,
        icon: './favicon.png'
      });
    });

    if ('serviceWorker' in navigator) {
      // Register with the exact subfolder scope to match GitHub Pages
      navigator.serviceWorker.register('./firebase-messaging-sw.js', { scope: '/MedicalApp-Clean/' })
        .then((reg) => {
          console.log('SW Registered. Waiting for activation...');

          // Wait for the Service Worker to wake up before asking for a token
          const checkActive = () => {
            if (reg.active && reg.active.state === 'activated') {
              console.log('SW is Active! Requesting token...');
              messaging.getToken({
                serviceWorkerRegistration: reg,
                vapidKey: "BKSqwX3_MZ4NgdD8BPmC1hXRDHj6qdLhIeqL6Epf-D6-2w3lBG1DKSYzbvPhNppDn89Hr_5DXRpXHVP12fpaC9Y"
              }).then((token) => {
                if (token) {
                  console.log('JS Captured Token:', token);
                  window.capturedToken = token; 
                }
              }).catch((err) => console.log('FCM Token Request Error:', err));
            } else {
              // Check again in 500ms
              setTimeout(checkActive, 500);
            }
          };
          
          checkActive();
        })
        .catch((err) => console.log('FCM Registration Error:', err));
    }
  </script>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #2C5F6E;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <script src="flutter_bootstrap.js" async=""></script>

</body></html>
