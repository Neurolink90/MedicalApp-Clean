          });
        })
        .then((token) => {
          if (token) {
            console.log('JS Captured Token:', token);
            window.capturedToken = token; // Save it for Flutter to grab
          }
        })
        .catch((err) => console.log('FCM Error in JS:', err));
    }
  </script>
