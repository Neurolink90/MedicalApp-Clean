<!DOCTYPE html>
<html>
<head>
  <base href="/MedicalApp-Clean/">

  <meta charset="UTF-8">
  <title>medical_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDu-DaxMY4O_IaRyPKM7DVigyi7zo1IntA",
      authDomain: "medirecords-pro.firebaseapp.com",
      projectId: "medirecords-pro",
      storageBucket: "medirecords-pro.firebaseasestorage.app",
      messagingSenderId: "379331373787",
      appId: "1:379331373787:web:33555fcacc7fa3a92a7afe",
      measurementId: "G-61P8TKS1V2"
    };

    // 1. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    // 2. Register Service Worker with the CORRECT subfolder path
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./firebase-messaging-sw.js')
        .then((registration) => {
          console.log('SW Registered in subfolder:', registration.scope);
          
          // 3. Request Token via JS (Bypassing Flutter's 404 bug)
          return getToken(messaging, {
            serviceWorkerRegistration: registration,
            vapidKey: "Y-8MX6fQIc9vD6JLqXswr4N2bui4dks9fDNNo27c0gA"
          });
        })
        .then((token) => {
          if (token) {
            console.log('JS Captured Token:', token);
            window.capturedToken = token; // Save it for Flutter to grab
          }
        })
        .catch((err) => console.log('FCM Error in JS:', err));
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
