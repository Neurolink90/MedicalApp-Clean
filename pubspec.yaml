name: medical_app
description: A cross-platform medical records app for secure patient management, analysis, and reminders.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  file_picker: ^8.0.0
  mime: ^1.0.4
  qr_flutter: ^4.1.0  # <--- NEW: For QR Sharing Feature

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
