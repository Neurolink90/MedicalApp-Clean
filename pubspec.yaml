name: medical_app
description: MediRecords Pro - Secure cross-platform medical records app.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.1

  # Firebase — pinned stable set
  firebase_core:      ^3.1.1
  firebase_core_web:  ^2.17.1
  firebase_auth:      ^5.1.2
  firebase_messaging: ^15.0.3
  cloud_firestore:    ^5.0.0

  # UI & Utilities
  table_calendar:              ^3.1.2
  flutter_local_notifications: ^17.2.2
  intl:                        ^0.19.0
  url_launcher:                ^6.2.5
  file_picker:                 ^8.0.0
  mime:                        ^1.0.4
  qr_flutter:                  ^4.1.0
  shared_preferences:          ^2.2.3
  local_auth:                  ^2.3.0

  # Timezone support — required for scheduled medication notifications
  timezone:                    ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Native splash screen generator — dev-only, generates Android splash
  # resources at build time. Not needed at runtime.
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/

# Config consumed by `dart run flutter_native_splash:create`.
# Regenerates android/app/src/main/res/values*/styles.xml and drawable
# resources — safe to re-run any time the icon or color changes.
flutter_native_splash:
  color: "#2C5F6E"
  image: assets/daysman_splash_icon.png
  android_12:
    color: "#2C5F6E"
    image: assets/daysman_splash_icon.png
  fullscreen: false
